name: chronos
description: Chronos – Arbeitszeit- und Live-Lohn-Tracker für Stundenjobs.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State & Daten
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  clock: ^1.1.3
  uuid: ^4.6.0

  # Plattform
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1

  # Export & Diagramme
  pdf: ^3.13.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
